# DocFu Configuration Example
# Place docfu.yml at your docs root or in subdirectories for hierarchical config

# Site info (required in root docfu.yml)
site:
  name: Documentation
  url: https://docs.example.com
  theme: nova # 'nova' (default) or 'starlight'

# Sandbox directory
# Artifacts (auto generated):
# - dist (static website subdir)
# - workspace (starlight project subdir)
# - config.yml (this config file)
# - manifest.json (build artifact)
sandbox: .docfu

# Assets directory
# Copied to workspace/public/ - reference with relative paths in markdown
assets: assets

# Components directory
# Copied to workspace/src/components/ - auto-imported for MDX, tags for Markdoc
components: components

# Exclude from processing (optional)
# exclude:
#   - archive
#   - '*.tmp.md'

# Exclude from search only (optional)
# unlisted:
#   - drafts
#   - 'wip-*.md'

# Sidebar navigation (optional, auto-generated if omitted)
# sidebar:
#   - file: index.md
#     label: Home
#   - group: Guides
#     items:
#       - quickstart.md
#       - file: installation.md
#         badge: New
#   - group: API
