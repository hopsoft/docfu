name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  cli-variants:
    name: CLI (${{ matrix.cli.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli:
          - name: npx
            setup: npm ci
            cmd: npx --yes
          - name: pnpm-dlx
            setup: |
              corepack enable
              corepack prepare pnpm@latest --activate
            cmd: pnpm dlx
          - name: yarn-dlx
            setup: |
              corepack enable
              corepack prepare yarn@stable --activate
            cmd: yarn dlx
          - name: bunx
            setup: |
              curl -fsSL https://bun.sh/install | bash
              echo "$HOME/.bun/bin" >> $GITHUB_PATH
            cmd: bunx
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup CLI tool
        run: ${{ matrix.cli.setup }}

      - name: Pack DocFu
        run: npm pack

      - name: Create test fixture
        run: |
          mkdir -p /tmp/docfu-test
          cd /tmp/docfu-test
          cat > docfu.yml << 'EOF'
          site:
            name: Test Docs
            url: https://example.com
          EOF
          cat > index.md << 'EOF'
          # Welcome
          This is a test documentation site.
          EOF
          mkdir -p guides
          cat > guides/quickstart.md << 'EOF'
          # Quick Start
          Get started quickly.
          EOF

      - name: Test CLI execution
        run: |
          cd /tmp/docfu-test
          TARBALL=$(ls $GITHUB_WORKSPACE/docfu-*.tgz)
          ${{ matrix.cli.cmd }} $TARBALL prepare . --root .docfu

      - name: Verify output
        run: |
          test -f /tmp/docfu-test/.docfu/workspace/src/content/docs/index.md
          test -f /tmp/docfu-test/.docfu/workspace/src/content/docs/guides/quickstart.md
          echo "✓ CLI ${{ matrix.cli.name }} works correctly"
