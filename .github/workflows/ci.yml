name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  cli-variants:
    name: CLI (${{ matrix.pm.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm:
          - name: npm
            pack: npm pack
            install: npm install ./docfu-*.tgz --prefix /tmp/docfu-install
            binary: /tmp/docfu-install/node_modules/.bin/docfu
          - name: pnpm
            setup: |
              corepack enable
              corepack prepare pnpm@latest --activate
            pack: npm pack
            install: |
              mkdir -p /tmp/docfu-install
              cd /tmp/docfu-install
              pnpm init -y
              pnpm add $GITHUB_WORKSPACE/docfu-*.tgz
            binary: /tmp/docfu-install/node_modules/.bin/docfu
          - name: yarn
            setup: |
              corepack enable
              corepack prepare yarn@stable --activate
            pack: npm pack
            install: |
              mkdir -p /tmp/docfu-install
              cd /tmp/docfu-install
              yarn init -y
              yarn add file:$GITHUB_WORKSPACE/docfu-*.tgz
            binary: /tmp/docfu-install/node_modules/.bin/docfu
          - name: bun
            setup: |
              curl -fsSL https://bun.sh/install | bash
              echo "$HOME/.bun/bin" >> $GITHUB_PATH
            pack: npm pack
            install: |
              mkdir -p /tmp/docfu-install
              cd /tmp/docfu-install
              bun init -y
              bun add $GITHUB_WORKSPACE/docfu-*.tgz
            binary: /tmp/docfu-install/node_modules/.bin/docfu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup package manager
        if: matrix.pm.setup
        run: ${{ matrix.pm.setup }}

      - name: Install build dependencies
        run: npm ci

      - name: Pack DocFu
        run: ${{ matrix.pm.pack }}

      - name: Install packed tarball
        run: ${{ matrix.pm.install }}

      - name: Create test fixture
        run: |
          mkdir -p /tmp/docfu-test
          cd /tmp/docfu-test
          cat > docfu.yml << 'EOF'
          site:
            name: Test Docs
            url: https://example.com
          EOF
          cat > index.md << 'EOF'
          # Welcome
          This is a test documentation site.
          EOF
          mkdir -p guides
          cat > guides/quickstart.md << 'EOF'
          # Quick Start
          Get started quickly.
          EOF

      - name: Test CLI execution
        run: |
          cd /tmp/docfu-test
          ${{ matrix.pm.binary }} prepare . --root .docfu

      - name: Verify output
        run: |
          test -f /tmp/docfu-test/.docfu/workspace/src/content/docs/index.md
          test -f /tmp/docfu-test/.docfu/workspace/src/content/docs/guides/quickstart.md
          echo "✓ CLI with ${{ matrix.pm.name }} works correctly"
