name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  package-managers:
    name: Test (${{ matrix.pm.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm:
          - name: npm
            install: npm ci
            test: npm test
          - name: pnpm
            install: |
              corepack enable
              corepack prepare pnpm@latest --activate
              pnpm install --frozen-lockfile
            test: pnpm test
          - name: yarn-classic
            install: |
              corepack enable
              corepack prepare yarn@1.22.22 --activate
              yarn install --frozen-lockfile
            test: yarn test
          - name: yarn-pnp
            install: |
              corepack enable
              corepack prepare yarn@stable --activate
              echo 'nodeLinker: pnp' > .yarnrc.yml
              yarn install
            test: yarn test
          - name: bun
            setup: |
              curl -fsSL https://bun.sh/install | bash
              echo "$HOME/.bun/bin" >> $GITHUB_PATH
            install: bun install --frozen-lockfile
            test: bun test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup package manager
        if: matrix.pm.setup
        run: ${{ matrix.pm.setup }}

      - name: Install dependencies
        run: ${{ matrix.pm.install }}

      - name: Run tests
        run: ${{ matrix.pm.test }}
