name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  package-test:
    name: Package Test (${{ matrix.pm.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm:
          - name: npm
            script: test:npm
          - name: pnpm
            script: test:pnpm
            setup: |
              corepack enable
              corepack prepare pnpm@latest --activate
          - name: yarn
            script: test:yarn
            setup: |
              corepack enable
              corepack prepare yarn@stable --activate
          - name: bun
            script: test:bun
            setup: npm install -g bun
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup package manager
        if: matrix.pm.setup
        run: ${{ matrix.pm.setup }}

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package test
        run: pnpm run ${{ matrix.pm.script }}
